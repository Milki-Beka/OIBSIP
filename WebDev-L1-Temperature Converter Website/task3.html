<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="task3.css">
</head>
<body>

    <div class="converter-box">
        <h2>Temperature Converter</h2>
        
        <div class="input-group">
            <label for="tempInput">Enter Temperature:</label>
            <input type="number" id="tempInput" placeholder="E.g., 40" step="any">
        </div>

        <div class="input-group">
            <label for="unitSelect">From Unit:</label>
            <select id="unitSelect">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
            </select>
        </div>

        <button id="convertBotton">Convert</button>


        <div class="results-box">
            <h3>Converted Results:</h3>
            <p id="resultC">Celsius: </p>
            <p id="resultF">Fahrenheit: </p>
            <p id="resultK">Kelvin: </p>
        </div>
    </div>

    <script src="task3.js"></script>
</body>
</html>
